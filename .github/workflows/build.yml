name: Build

on:
  push:
    # Docs-only and Windows-only changes don't need a Mac build.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'windows/**'
      - '.github/workflows/build-windows.yml'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'windows/**'
  workflow_dispatch:

# A newer push to the same branch cancels the build it replaces.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Video libraries (pinned, hash-checked)
        run: ./scripts/fetch-mac-deps.sh

      - name: Build Glance.app
        run: ./scripts/bundle.sh

      - name: Make DMG
        run: |
          mkdir -p build/dmg
          cp -R build/Glance.app build/dmg/
          # Drag-to-install layout: the app next to a link to /Applications.
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname Glance -srcfolder build/dmg -ov -format UDZO build/Glance.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: Glance-dmg
          path: build/Glance.dmg
          # Each push makes a new one; old DMGs aren't worth the storage.
          retention-days: 7
