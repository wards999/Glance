name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Build Glance.app
        run: ./scripts/bundle.sh

      - name: Make DMG
        run: |
          mkdir -p build/dmg
          cp -R build/Glance.app build/dmg/
          # Drag-to-install layout: the app next to a link to /Applications.
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname Glance -srcfolder build/dmg -ov -format UDZO build/Glance.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: Glance-dmg
          path: build/Glance.dmg
