name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Build Glance.app
        run: ./scripts/bundle.sh

      - name: Zip app
        run: ditto -c -k --keepParent build/Glance.app build/Glance.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Glance
          path: build/Glance.zip
