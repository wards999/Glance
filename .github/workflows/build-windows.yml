name: Build Windows

on:
  push:
    paths:
      - 'windows/**'
      - 'Sources/CMpv/**'
      - 'LICENSE'
      - 'THIRD-PARTY-NOTICES.md'
      - '.github/workflows/build-windows.yml'
  pull_request:
    paths:
      - 'windows/**'
      - 'Sources/CMpv/**'
  workflow_dispatch:

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build with MSVC
        run: |
          # No generator named: CMake picks the runner's newest Visual Studio.
          cmake -S windows -B windows/build -A x64
          cmake --build windows/build --config Release

      - name: Add PDFium (pinned build, hash-checked)
        shell: pwsh
        run: |
          # Chrome's PDF engine, prebuilt by bblanchon/pdfium-binaries. Pinned to one build and
          # checked against its SHA-256, so a changed download fails the build.
          $url = 'https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F8076/pdfium-win-x64.tgz'
          $expected = '808D36DA9BC5A3104315FB307C80998121F565EE53953633BF33E80D7429E5AC'
          Invoke-WebRequest $url -OutFile pdfium.tgz
          $actual = (Get-FileHash pdfium.tgz -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "pdfium.tgz is $actual, expected the pinned $expected" }
          New-Item -ItemType Directory pdfium | Out-Null
          tar -xzf pdfium.tgz -C pdfium
          Copy-Item pdfium/bin/pdfium.dll windows/build/Release/
          Copy-Item pdfium/LICENSE windows/build/Release/pdfium-LICENSE.txt
          Copy-Item pdfium/licenses windows/build/Release/pdfium-licenses -Recurse

      - name: Run tests
        run: windows/build/Release/glance-tests.exe

      - name: Add libmpv (pinned build, hash-checked)
        shell: pwsh
        run: |
          # mpv's engine for video, prebuilt by shinchiro/mpv-winbuild-cmake; Glance keeps its own
          # copy as the windows-deps-20261021 release asset. Both the download and the DLL inside
          # are checked against their SHA-256, so a changed file fails the build.
          $url = 'https://github.com/wards999/Glance/releases/download/windows-deps-20261021/mpv-dev-x86_64-20261021-git-e471496c56.7z'
          $expected = 'EFC719EFF3DC5954B4A5EFC800632808BCEC01CC9034940DD14E5EB7FE9EA633'
          Invoke-WebRequest $url -OutFile mpv.7z
          $actual = (Get-FileHash mpv.7z -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "mpv.7z is $actual, expected the pinned $expected" }
          7z e -y -ompv mpv.7z libmpv-2.dll | Out-Null
          $dll = (Get-FileHash mpv/libmpv-2.dll -Algorithm SHA256).Hash
          if ($dll -ne '04E4D27DC385DC18DDD93FBE69C75E635B864F3C6EC53A9122DF54C2F7842F4A') { throw "libmpv-2.dll is $dll" }

      - name: Make the download (Glance-windows.zip)
        shell: pwsh
        run: |
          # Built from a clean folder every time, so nothing from a test run (Glance.ini...) can
          # end up in the download.
          $version = (Select-String -Path windows/src/Version.h -Pattern 'GLANCE_VERSION_TEXT "(.+)"').Matches[0].Groups[1].Value
          $out = 'package/Glance'
          New-Item -ItemType Directory $out | Out-Null
          $built = 'windows/build/Release'
          Copy-Item "$built/Glance.exe", "$built/GlanceThumbnails.dll", "$built/pdfium.dll", "$built/pdfium-LICENSE.txt", mpv/libmpv-2.dll $out
          Copy-Item "$built/pdfium-licenses" $out -Recurse
          Copy-Item LICENSE "$out/LICENSE.txt"
          Copy-Item THIRD-PARTY-NOTICES.md "$out/THIRD-PARTY-NOTICES.txt"
          (Get-Content windows/README.txt -Raw).Replace('Glance VERSION for Windows', "Glance $version for Windows") |
              Set-Content "$out/README.txt" -NoNewline -Encoding ascii
          # Exactly these files, nothing more or less.
          $expected = @('Glance.exe', 'GlanceThumbnails.dll', 'LICENSE.txt', 'README.txt', 'THIRD-PARTY-NOTICES.txt',
                        'libmpv-2.dll', 'pdfium-LICENSE.txt', 'pdfium.dll', 'pdfium-licenses') | Sort-Object
          $actual = Get-ChildItem $out | ForEach-Object Name | Sort-Object
          if (Compare-Object $expected $actual) { throw "Unexpected files in the download: $($actual -join ', ')" }
          Compress-Archive -Path $out -DestinationPath Glance-windows.zip
          "Glance ${version}: $((Get-ChildItem $out -Recurse -File).Count) files, $([int]((Get-Item Glance-windows.zip).Length / 1MB)) MB"

      - uses: actions/upload-artifact@v4
        with:
          name: Glance-windows-zip
          path: Glance-windows.zip
          compression-level: 0
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: Glance-windows
          path: |
            windows/build/Release/*.exe
            windows/build/Release/GlanceThumbnails.dll
            windows/build/Release/pdfium.dll
            windows/build/Release/pdfium-LICENSE.txt
            windows/build/Release/pdfium-licenses/
          retention-days: 7
